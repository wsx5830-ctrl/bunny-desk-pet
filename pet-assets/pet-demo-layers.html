<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>桌宠分层演示 —— 兔耳小人（11 层）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #DCD7CE;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    user-select: none;
  }
  #taskbar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 44px;
    background: #F4F1EB; border-top: 1px solid #C9C4BA;
    display: flex; align-items: center; padding: 0 16px;
    color: #6B675F; font-size: 13px; gap: 8px;
  }
  #taskbar .dot { width: 8px; height: 8px; border-radius: 50%; background: #C23B3B; }
  #hint {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    color: #6B675F; font-size: 13px; background: rgba(255,255,255,.7);
    border: 1px solid #C9C4BA; border-radius: 12px; padding: 8px 16px;
  }
  #pet {
    position: absolute;
    width: 190px; aspect-ratio: 611 / 617;
    cursor: grab; will-change: transform, left, top;
  }
  #pet:active { cursor: grabbing; }
  #pet img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    -webkit-user-drag: none; pointer-events: none;
  }
  #bubble {
    position: absolute; left: 50%; bottom: calc(100% + 14px);
    transform: translateX(-50%) translateY(6px) scale(.9);
    background: #FFFFFF; border: 1px solid #C9C4BA; border-radius: 12px;
    padding: 7px 12px; font-size: 13px; color: #3A372F;
    white-space: nowrap; opacity: 0; pointer-events: none;
    transition: opacity .18s ease, transform .18s ease; z-index: 30;
  }
  #bubble.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  #bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -5px;
    width: 8px; height: 8px; background: #FFFFFF;
    border-right: 1px solid #C9C4BA; border-bottom: 1px solid #C9C4BA;
    transform: translateX(-50%) rotate(45deg);
  }
  #zzz {
    position: absolute; right: -6px; top: -14px; z-index: 30;
    font-size: 20px; font-weight: 500; color: #6B675F;
    opacity: 0; pointer-events: none;
  }
  body.sleep #zzz { animation: zzz 2.4s ease-in-out infinite; }
  @keyframes zzz {
    0% { opacity: 0; transform: translate(0,0); }
    30% { opacity: .9; }
    100% { opacity: 0; transform: translate(16px,-26px); }
  }
  body.sleep #pet { filter: brightness(.72) saturate(.7); }

  /* ---- 各层支点 ---- */
  #l-ear_L   { transform-origin: 46.0% 54.3%; }
  #l-ear_R   { transform-origin: 71.7% 42.6%; }
  #l-face, #l-hair, #l-mouth, #l-eye_L, #l-eye_R { transform-origin: 57.4% 74.2%; }
  #l-eye_L   { transform-origin: 47.0% 60.5%; }
  #l-eye_R   { transform-origin: 67.6% 60.5%; }
  #l-body, #l-shorts { transform-origin: 57.3% 99.5%; }

  /* ---- 常驻微动 ---- */
  body.live #l-body, body.live #l-shorts { animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.014); } }
  body.live #l-ear_L { animation: swayL 3.2s ease-in-out infinite; }
  body.live #l-ear_R { animation: swayR 3.2s ease-in-out infinite; }
  @keyframes swayL { 0%,100% { transform: rotate(-2.2deg); } 50% { transform: rotate(2.6deg); } }
  @keyframes swayR { 0%,100% { transform: rotate(2.4deg); } 50% { transform: rotate(-2deg); } }
  body.live #l-hair { animation: hairsway 3.2s ease-in-out infinite; }
  @keyframes hairsway { 0%,100% { transform: rotate(-.6deg); } 50% { transform: rotate(.7deg); } }

  /* ---- 事件动画 ---- */
  #pet img.blink { animation: blink .16s ease-in-out 1 !important; }
  @keyframes blink { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(.08); } }
  #pet.nod #l-face, #pet.nod #l-hair, #pet.nod #l-mouth,
  #pet.nod #l-eye_L, #pet.nod #l-eye_R { animation: nod .55s cubic-bezier(.35,1.6,.5,1) 1 !important; }
  @keyframes nod { 0% { transform: rotate(0); } 35% { transform: rotate(-7deg); } 70% { transform: rotate(5deg); } 100% { transform: rotate(0); } }
  #pet.flap #l-ear_L { animation: flapL .38s ease-in-out 3 !important; }
  #pet.flap #l-ear_R { animation: flapR .38s ease-in-out 3 !important; }
  @keyframes flapL { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-13deg); } }
  @keyframes flapR { 0%,100% { transform: rotate(0); } 50% { transform: rotate(13deg); } }
  #pet.squash { animation: squash .5s cubic-bezier(.3,1.6,.5,1) 1 !important; }
  @keyframes squash {
    0% { transform: scale(1,1); }
    30% { transform: scale(1.1,.88); }
    60% { transform: scale(.95,1.06); }
    100% { transform: scale(1,1); }
  }
</style>
</head>
<body class="live">
<div id="hint">拖拽甩出去 · 单击戳一戳 · 20 秒不理它会睡着（分层版：会眨眼、摆耳朵）</div>

<div id="pet">
  <img id="l-shorts" src="character/layers/shorts.png" alt="">
  <img id="l-body"   src="character/layers/body.png" alt="">
  <img id="l-hand_L" src="character/layers/hand_L.png" alt="">
  <img id="l-hand_R" src="character/layers/hand_R.png" alt="">
  <img id="l-face"   src="character/layers/face.png" alt="">
  <img id="l-mouth"  src="character/layers/mouth.png" alt="">
  <img id="l-eye_L"  src="character/layers/eye_L.png" alt="">
  <img id="l-eye_R"  src="character/layers/eye_R.png" alt="">
  <img id="l-hair"   src="character/layers/hair.png" alt="">
  <img id="l-ear_L"  src="character/layers/ear_L.png" alt="">
  <img id="l-ear_R"  src="character/layers/ear_R.png" alt="">
  <div id="zzz">Z z z</div>
  <div id="bubble"></div>
</div>

<div id="taskbar"><span class="dot"></span><span>桌宠分层版 —— 11 层 cut-out：ear_L/R · hair · face · eye_L/R · mouth · hand_L/R · body · shorts</span></div>

<script>
const pet = document.getElementById("pet");
const bubble = document.getElementById("bubble");
const eyeL = document.getElementById("l-eye_L");
const eyeR = document.getElementById("l-eye_R");

const QUOTES = {
  idle: ["好无聊啊，戳我一下嘛", "（盯着你的屏幕看）", "今天也要加油哦", "兔耳朵好看嘛？"],
  poke: ["干嘛啦！", "嘿嘿，手好痒", "比心比心", "再戳要生气了哦"],
  drag: ["哇啊啊要掉下去了", "放开我，放开我", "耳朵要飞出去了"],
  fall: ["哎哟！", "下次轻一点嘛"],
};

const W = 190, GRAVITY = 2400, FLOOR_PAD = 44, BOUNCE = 0.35, AIR = 0.995;
const H = W * 617 / 611;
let x = innerWidth / 2, y = 300, vx = 0, vy = 0;
let state = "fall", dragging = false, moved = false, landed = false;
let lastPointer = null, lastT = 0;
let sleepTimer = null, idleQuoteTimer = null, bubbleTimer = null, blinkTimer = null;

const floorY = () => innerHeight - FLOOR_PAD;
const pick = a => a[Math.floor(Math.random() * a.length)];

function setStates(s) {
  document.body.classList.toggle("sleep", s === "sleep");
  document.body.classList.toggle("live", s !== "sleep");
}

function say(text, ms = 2200) {
  bubble.textContent = text;
  bubble.classList.add("show");
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => bubble.classList.remove("show"), ms);
}

function oneShot(cls, ms) {
  pet.classList.add(cls);
  setTimeout(() => pet.classList.remove(cls), ms);
}

function blink() {
  for (const el of [eyeL, eyeR]) {
    el.classList.remove("blink");
    void el.offsetWidth;
    el.classList.add("blink");
  }
  blinkTimer = setTimeout(blink, 2600 + Math.random() * 3200);
}

function scheduleIdleQuote() {
  clearTimeout(idleQuoteTimer);
  idleQuoteTimer = setTimeout(() => {
    if (state === "idle") say(pick(QUOTES.idle));
    scheduleIdleQuote();
  }, 12000 + Math.random() * 8000);
}

function wake() {
  clearTimeout(sleepTimer);
  if (state === "sleep") { state = "idle"; setStates("idle"); }
  sleepTimer = setTimeout(() => {
    if (state === "idle") { state = "sleep"; setStates("sleep"); say("Zzz……", 1500); }
  }, 20000);
}

function render(tilt = 0) {
  pet.style.left = (x - W / 2) + "px";
  pet.style.top = (y - H) + "px";
  if (!pet.classList.contains("squash")) {
    pet.style.transform = "rotate(" + tilt + "deg)";
  }
}

function step() {
  const now = performance.now();
  const dt = Math.min((now - (step.t || now)) / 1000, 0.05);
  step.t = now;
  if (state === "fall" && !dragging) {
    vy += GRAVITY * dt;
    vx *= AIR;
    x += vx * dt;
    y += vy * dt;
    if (y >= floorY()) {
      y = floorY();
      if (Math.abs(vy) > 140 && !landed) {
        vy = -vy * BOUNCE;
        say(pick(QUOTES.fall), 1400);
        oneShot("squash", 500);
        landed = true;
      } else if (Math.abs(vy) > 40) {
        vy = -vy * BOUNCE * 0.6;
      } else {
        vy = 0; vx = 0; landed = false;
        state = "idle"; setStates("idle"); wake();
      }
    }
    if (x < W / 2) { x = W / 2; vx = Math.abs(vx) * BOUNCE; }
    if (x > innerWidth - W / 2) { x = innerWidth - W / 2; vx = -Math.abs(vx) * BOUNCE; }
  }
  if (dragging && lastPointer) {
    const pdt = Math.max((now - lastT) / 1000, 0.001);
    const nx = lastPointer.x, ny = lastPointer.y + H * 0.72;
    vx = (nx - x) / pdt * 0.9;
    x += (nx - x) * 0.55;
    y += (ny - y) * 0.55;
    lastT = now;
  }
  render(dragging ? Math.max(-14, Math.min(14, vx * 0.012)) : 0);
  requestAnimationFrame(step);
}

pet.addEventListener("pointerdown", (e) => {
  pet.setPointerCapture(e.pointerId);
  dragging = true; moved = false;
  lastPointer = { x: e.clientX, y: e.clientY };
  lastT = performance.now();
  wake();
});
pet.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  if (!moved && Math.hypot(e.clientX - lastPointer.x, e.clientY - lastPointer.y) > 6) {
    moved = true;
    state = "drag"; setStates("idle");
    if (Math.random() < 0.5) say(pick(QUOTES.drag), 1500);
    oneShot("flap", 1200);
  }
  lastPointer = { x: e.clientX, y: e.clientY };
});
pet.addEventListener("pointerup", () => {
  dragging = false;
  if (!moved) {
    state = "poke";
    say(pick(QUOTES.poke));
    oneShot("squash", 500);
    oneShot("nod", 560);
    oneShot("flap", 1200);
    setTimeout(() => { if (state === "poke") state = "idle"; }, 560);
  } else {
    state = "fall"; landed = false;
  }
  wake();
});
addEventListener("resize", () => { y = Math.min(y, floorY()); });

render();
requestAnimationFrame(step);
blink();
scheduleIdleQuote();
wake();
</script>
</body>
</html>
