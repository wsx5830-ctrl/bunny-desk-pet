<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#DCD7CE">
<title>桌宠 · 皮肤系统演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #DCD7CE;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    user-select: none;
  }
  :root { --accent: #C23B3B; }
  #taskbar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 44px;
    background: #F4F1EB; border-top: 1px solid #C9C4BA;
    display: flex; align-items: center; padding: 0 16px;
    color: #6B675F; font-size: 13px; gap: 10px;
  }
  #taskbar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); transition: background .3s; }
  #skinBtn {
    margin-left: auto; border: 1px solid #C9C4BA; background: #fff; color: #3A372F;
    border-radius: 8px; padding: 5px 12px; font-size: 12px; cursor: pointer;
  }
  #skinBtn:hover { border-color: var(--accent); color: var(--accent); }
  #hint {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    color: #6B675F; font-size: 13px; background: rgba(255,255,255,.7);
    border: 1px solid #C9C4BA; border-radius: 12px; padding: 8px 16px; text-align: center;
  }
  #pet {
    position: absolute;
    width: 200px; aspect-ratio: 1 / 1;
    cursor: grab; will-change: transform, left, top;
    transition: opacity .14s ease, filter .14s ease;
    touch-action: none; -webkit-tap-highlight-color: transparent;
  }
  #pet.swapping { opacity: 0; filter: blur(3px); }
  #pet:active { cursor: grabbing; }
  #pet img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    -webkit-user-drag: none; pointer-events: none;
  }
  #bubble {
    position: absolute; left: 50%; bottom: calc(100% + 14px);
    transform: translateX(-50%) translateY(6px) scale(.9);
    background: #FFFFFF; border: 1px solid #C9C4BA; border-radius: 12px;
    padding: 7px 12px; font-size: 13px; color: #3A372F;
    white-space: nowrap; opacity: 0; pointer-events: none;
    transition: opacity .18s ease, transform .18s ease; z-index: 30;
  }
  #bubble.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  #bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -5px;
    width: 8px; height: 8px; background: #FFFFFF;
    border-right: 1px solid #C9C4BA; border-bottom: 1px solid #C9C4BA;
    transform: translateX(-50%) rotate(45deg);
  }
  #zzz {
    position: absolute; right: -6px; top: -14px; z-index: 30;
    font-size: 20px; font-weight: 500; color: #6B675F;
    opacity: 0; pointer-events: none;
  }
  body.sleep #zzz { animation: zzz 2.4s ease-in-out infinite; }
  @keyframes zzz {
    0% { opacity: 0; transform: translate(0,0); }
    30% { opacity: .9; }
    100% { opacity: 0; transform: translate(16px,-26px); }
  }
  body.sleep #pet { filter: brightness(.72) saturate(.7); }

  /* ---- 常驻微动：由 skin.json 的 anim 能力表驱动，与具体皮肤无关 ---- */
  body.live [data-breathe] { animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.014); } }
  body.live [data-sway="L"] { animation: swayL 3.2s ease-in-out infinite; }
  body.live [data-sway="R"] { animation: swayR 3.2s ease-in-out infinite; }
  @keyframes swayL { 0%,100% { transform: rotate(-2.2deg); } 50% { transform: rotate(2.6deg); } }
  @keyframes swayR { 0%,100% { transform: rotate(2.4deg); } 50% { transform: rotate(-2deg); } }
  body.live [data-sway="tail"] { animation: tailsway 2.4s ease-in-out infinite; }
  @keyframes tailsway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  body.live [data-sway="hair"] { animation: hairsway 3.2s ease-in-out infinite; }
  @keyframes hairsway { 0%,100% { transform: rotate(-.6deg); } 50% { transform: rotate(.7deg); } }

  /* ---- 事件动画 ---- */
  #pet img.blink { animation: blink .16s ease-in-out 1 !important; }
  @keyframes blink { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(.08); } }
  /* 头部组：脸/头发/嘴/眼，以及“固定不摆”的耳朵——耳朵静止也必须跟头一起转 */
  #pet.nod [data-head] { animation: nod .55s cubic-bezier(.35,1.6,.5,1) 1 !important; }
  @keyframes nod { 0% { transform: rotate(0); } 35% { transform: rotate(-7deg); } 70% { transform: rotate(5deg); } 100% { transform: rotate(0); } }
  #pet.flap [data-sway="L"] { animation: flapL .38s ease-in-out 3 !important; }
  #pet.flap [data-sway="R"] { animation: flapR .38s ease-in-out 3 !important; }
  @keyframes flapL { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-13deg); } }
  @keyframes flapR { 0%,100% { transform: rotate(0); } 50% { transform: rotate(13deg); } }
  #pet.squash { animation: squash .5s cubic-bezier(.3,1.6,.5,1) 1 !important; }
  @keyframes squash {
    0% { transform: scale(1,1); }
    30% { transform: scale(1.1,.88); }
    60% { transform: scale(.95,1.06); }
    100% { transform: scale(1,1); }
  }

  /* ---- 皮肤面板 ---- */
  #skinPanel {
    position: absolute; right: 16px; bottom: 56px; width: 250px;
    background: #F4F1EB; border: 1px solid #C9C4BA; border-radius: 14px;
    padding: 12px; display: none; z-index: 50;
    box-shadow: 0 8px 24px rgba(0,0,0,.12);
  }
  #skinPanel.open { display: block; }
  #skinPanel h3 { font-size: 13px; color: #3A372F; margin: 2px 4px 10px; font-weight: 600; }
  #skinGrid { display: flex; flex-wrap: wrap; gap: 8px; }
  .skinCard {
    width: 68px; cursor: pointer; text-align: center; padding: 6px 4px 5px;
    border: 2px solid transparent; border-radius: 10px; background: #fff;
    transition: transform .12s ease, border-color .12s ease;
  }
  .skinCard:hover { transform: translateY(-2px); }
  .skinCard.on { border-color: var(--accent); }
  .skinCard img { width: 52px; height: 52px; object-fit: contain; }
  .skinCard div { font-size: 11px; color: #6B675F; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #skinPanel .tip { font-size: 11px; color: #9B968C; margin-top: 10px; padding: 0 4px; line-height: 1.6; }

  /* ---- 手机 / 窄屏适配：链接被转发后大概率在手机上打开 ---- */
  @media (max-width: 560px) {
    #hint { top: 12px; left: 12px; right: 12px; transform: none; font-size: 12px; line-height: 1.6; white-space: normal; padding: 7px 12px; }
    #pet { width: 130px; }
    #bubble { white-space: normal; max-width: 62vw; text-align: center; line-height: 1.4; }
    #zzz { font-size: 16px; right: -2px; }
    #taskbar { height: 40px; padding: 0 10px; gap: 8px; font-size: 12px; }
    #skinBtn { padding: 4px 10px; font-size: 12px; }
    #skinPanel { left: 10px; right: 10px; bottom: 48px; width: auto; padding: 10px; }
    #skinPanel h3 { font-size: 12px; margin: 0 2px 8px; }
    #skinGrid { gap: 6px; }
    .skinCard { width: 56px; padding: 5px 3px 4px; }
    .skinCard img { width: 42px; height: 42px; }
    .skinCard div { font-size: 10px; }
    #skinPanel .tip { display: none; }
  }
</style>
</head>
<body class="live">
<div id="hint">拖一下它 · 点一下戳它 · 点「换装」换皮肤（右键 / S 也行）</div>

<div id="pet"><div id="zzz">Z z z</div><div id="bubble"></div></div>

<div id="skinPanel">
  <h3>换装 · 皮肤柜</h3>
  <div id="skinGrid"></div>
  <div class="tip">皮肤包规范：skins/&lt;id&gt;/skin.json + layers/*.png，画布 640×640、脚底 y=616。放入新包后无需改代码。</div>
</div>

<div id="taskbar">
  <span class="dot"></span><span id="skinLabel">桌宠皮肤系统</span>
  <button id="skinBtn">换装</button>
</div>

const CURRENT_SKIN_ID = "default";
//__SKINS_END__

//__QUOTES_START__
const QUOTES = {"idle": ["好无聊啊 戳我一下嘛", "（盯着你的屏幕看）", "今天也要加油哦", "你在忙什么呀", "坐久了要起来动一动哦", "（偷偷伸了个懒腰）", "我在这儿陪着你呢", "这个代码又报错了吗", "喝口水吧 别忘了", "（歪头）你今天心情怎么样", "要不要摸摸我的头", "窗外的光好像变了", "（数你屏幕上的字）", "我先安静待着 不打扰你", "有点困了 但还想陪你", "我的头发有没有乱"], "poke": ["干嘛啦！", "再戳要生气了哦", "嘿嘿 手好痒", "别闹别闹", "痒！那里不能碰", "你戳我 我就戳回去", "这样很失礼诶", "（被戳得晃了晃）", "好啦好啦 我在这里", "再戳一下试试看？", "我是有脾气的哦", "摸头可以 戳脸不行"], "drag": ["哇啊啊要掉下去了", "放开我 放开我", "头发要飞出去了", "轻一点轻一点", "我要晕了", "这是要把我带去哪", "别甩别甩", "我自己会走的"], "fall": ["哎哟！", "下次轻一点嘛", "屁股好痛", "站稳了站稳了", "差点摔个跟头", "你手滑了吗", "（揉揉摔到的地方）"], "sleep": ["Zzz……", "（梦见吃着好吃的）", "（翻了个身）", "呼……呼……", "（抱着膝盖睡着了）", "再睡五分钟"], "wake": ["……嗯？我没睡", "你回来了！", "我刚刚只是在闭目养神", "（揉眼睛）现在几点", "睡得好舒服", "继续陪你！"]};
//__QUOTES_END__

/* ---------- 皮肤系统 ---------- */
const pet = document.getElementById("pet");
const bubble = document.getElementById("bubble");
const skinPanel = document.getElementById("skinPanel");
const skinGrid = document.getElementById("skinGrid");
const skinLabel = document.getElementById("skinLabel");
const CANVAS = 640;

let skin = SKINS.find(s => s.id === CURRENT_SKIN_ID) || SKINS[0];
try {
  const saved = localStorage.getItem("pet-skin");
  if (saved && SKINS.some(s => s.id === saved)) skin = SKINS.find(s => s.id === saved);
} catch (e) {}

function quotesOf(st) {
  /* 专属台词权重更高（重复两次），再拼通用池，永不出现空数组 */
  const own = (skin.quotes && skin.quotes[st]) || [];
  const gen = QUOTES[st] || [];
  const pool = [...own, ...own, ...gen];
  return pool.length ? pool : ["……"];
}

function buildSkinPanel() {
  skinGrid.innerHTML = "";
  SKINS.forEach((s, i) => {
    const card = document.createElement("div");
    card.className = "skinCard" + (s.id === skin.id ? " on" : "");
    const img = document.createElement("img");
    img.src = "skins/" + s.id + "/thumb.png";
    const name = document.createElement("div");
    name.textContent = s.name + " (" + (i + 1) + ")";
    card.appendChild(img); card.appendChild(name);
    card.onclick = () => applySkin(s);
    skinGrid.appendChild(card);
  });
}

function applySkin(s, silent) {
  if (s.id === skin.id && !silent) { closePanel(); return; }
  skin = s;
  try { localStorage.setItem("pet-skin", s.id); } catch (e) {}
  pet.classList.add("swapping");
  setTimeout(() => {
    renderSkin();
    pet.classList.remove("swapping");
  }, 140);
  document.documentElement.style.setProperty("--accent", s.accent || "#C23B3B");
  const na = s.anim || {};
  const roles = s.layers.map(l => l.role);
  const notes = [];
  if ((roles.includes("ear_L") || roles.includes("ear_R")) && na.earSway === false) notes.push("耳朵固定");
  if (roles.includes("tail") && na.tailSway === false) notes.push("尾巴固定");
  if (na.blink === false) notes.push("不眨眼");
  skinLabel.textContent = "当前皮肤：" + s.name + (notes.length ? " · " + notes.join(" · ") : "");
  [...skinGrid.children].forEach((c, i) => c.classList.toggle("on", SKINS[i].id === s.id));
  if (!silent) { say("换好啦！", 1400); oneShot("squash", 500); }
  closePanel();
}

function renderSkin() {
  /* 只清图层，保留气泡与 Zzz（它们也是 #pet 的子元素） */
  pet.querySelectorAll("img").forEach(n => n.remove());
  const a = skin.anim || {};
  const HEAD_ROLES = ["face", "hair", "mouth", "eye_L", "eye_R", "hat"];
  skin.layers.forEach(l => {
    const img = document.createElement("img");
    img.src = "skins/" + skin.id + "/" + l.src;
    img.dataset.role = l.role;
    const r = l.role;
    const pv = skin.pivots[r];
    if (pv) img.style.transformOrigin = (pv[0] / CANVAS * 100).toFixed(2) + "% " + (pv[1] / CANVAS * 100).toFixed(2) + "%";

    if (a.breathe !== false && (r === "body" || r === "shorts")) img.dataset.breathe = "1";
    if (a.nod !== false && HEAD_ROLES.includes(r)) img.dataset.head = "1";
    if (r === "hair" && a.hairSway !== false) img.dataset.sway = "hair";
    if (r === "tail" && a.tailSway !== false) img.dataset.sway = "tail";

    /* 耳朵：earSway=false 时不做独立摆动/扇动，但归入头部组，随点头一起转 */
    if (r === "ear_L" || r === "ear_R") {
      if (a.earSway === false) {
        if (a.nod !== false) img.dataset.head = "1";
      } else {
        img.dataset.sway = (r === "ear_L" ? "L" : "R");
      }
    }
    pet.appendChild(img);
  });
  pet._eyeL = pet.querySelector('[data-role="eye_L"]');
  pet._eyeR = pet.querySelector('[data-role="eye_R"]');
}

function openPanel() { skinPanel.classList.add("open"); }
function closePanel() { skinPanel.classList.remove("open"); }
document.getElementById("skinBtn").onclick = () => skinPanel.classList.toggle("open");
pet.addEventListener("contextmenu", e => { e.preventDefault(); openPanel(); });
addEventListener("keydown", e => {
  if (e.key === "s" || e.key === "S") { skinPanel.classList.toggle("open"); return; }
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= SKINS.length) applySkin(SKINS[n - 1]);
});

/* ---------- 状态机（与皮肤无关，只认 role） ---------- */
const eyeL = () => pet._eyeL, eyeR = () => pet._eyeR;
const W = 200, GRAVITY = 2400, FLOOR_PAD = 44, BOUNCE = 0.35, AIR = 0.995;
const H = W;
let x = innerWidth / 2, y = 300, vx = 0, vy = 0;
let state = "fall", dragging = false, moved = false, landed = false;
let lastPointer = null, lastT = 0;
let sleepTimer = null, idleQuoteTimer = null, bubbleTimer = null, blinkTimer = null;

const floorY = () => innerHeight - FLOOR_PAD;
const pick = a => a[Math.floor(Math.random() * a.length)];

function setStates(s) {
  document.body.classList.toggle("sleep", s === "sleep");
  document.body.classList.toggle("live", s !== "sleep");
}

function say(text, ms = 2200) {
  if (!bubble) return;
  bubble.textContent = text;
  bubble.classList.add("show");
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => bubble.classList.remove("show"), ms);
}

function oneShot(cls, ms) {
  pet.classList.add(cls);
  setTimeout(() => pet.classList.remove(cls), ms);
}

function blink() {
  if (skin.anim && skin.anim.blink === false) return;
  const L = eyeL(), R = eyeR();
  if (L && R) for (const el of [L, R]) {
    el.classList.remove("blink");
    void el.offsetWidth;
    el.classList.add("blink");
  }
  blinkTimer = setTimeout(blink, 2600 + Math.random() * 3200);
}

function scheduleIdleQuote() {
  clearTimeout(idleQuoteTimer);
  idleQuoteTimer = setTimeout(() => {
    if (state === "idle") say(pick(quotesOf("idle")));
    scheduleIdleQuote();
  }, 12000 + Math.random() * 8000);
}

function wake() {
  clearTimeout(sleepTimer);
  if (state === "sleep") { state = "idle"; setStates("idle"); say(pick(quotesOf("wake")), 1800); }
  sleepTimer = setTimeout(() => {
    if (state === "idle") { state = "sleep"; setStates("sleep"); say(pick(quotesOf("sleep")), 1800); }
  }, 20000);
}

function render(tilt = 0) {
  pet.style.left = (x - W / 2) + "px";
  pet.style.top = (y - H * 0.96) + "px";
  if (!pet.classList.contains("squash")) {
    pet.style.transform = "rotate(" + tilt + "deg)";
  }
}

function step() {
  const now = performance.now();
  const dt = Math.min((now - (step.t || now)) / 1000, 0.05);
  step.t = now;
  if (state === "fall" && !dragging) {
    vy += GRAVITY * dt;
    vx *= AIR;
    x += vx * dt;
    y += vy * dt;
    if (y >= floorY()) {
      y = floorY();
      if (Math.abs(vy) > 140 && !landed) {
        vy = -vy * BOUNCE;
        say(pick(quotesOf("fall")), 1400);
        oneShot("squash", 500);
        landed = true;
      } else if (Math.abs(vy) > 40) {
        vy = -vy * BOUNCE * 0.6;
      } else {
        vy = 0; vx = 0; landed = false;
        state = "idle"; setStates("idle"); wake();
      }
    }
    if (x < W / 2) { x = W / 2; vx = Math.abs(vx) * BOUNCE; }
    if (x > innerWidth - W / 2) { x = innerWidth - W / 2; vx = -Math.abs(vx) * BOUNCE; }
  }
  if (dragging && lastPointer) {
    const pdt = Math.max((now - lastT) / 1000, 0.001);
    const nx = lastPointer.x, ny = lastPointer.y + H * 0.72;
    vx = (nx - x) / pdt * 0.9;
    x += (nx - x) * 0.55;
    y += (ny - y) * 0.55;
    lastT = now;
  }
  render(dragging ? Math.max(-14, Math.min(14, vx * 0.012)) : 0);
  requestAnimationFrame(step);
}

pet.addEventListener("pointerdown", (e) => {
  if (e.button === 2) return;
  pet.setPointerCapture(e.pointerId);
  dragging = true; moved = false;
  lastPointer = { x: e.clientX, y: e.clientY };
  lastT = performance.now();
  wake();
});
pet.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  /* 先更新坐标，再做状态切换与台词：任何异常都不能挡住拖拽跟手 */
  const prev = lastPointer;
  lastPointer = { x: e.clientX, y: e.clientY };
  if (!moved && prev && Math.hypot(e.clientX - prev.x, e.clientY - prev.y) > 6) {
    moved = true;
    state = "drag"; setStates("idle");
    if (Math.random() < 0.5) say(pick(quotesOf("drag")), 1500);
    oneShot("flap", 1200);
  }
});
pet.addEventListener("pointerup", () => {
  dragging = false;
  if (!moved) {
    state = "poke";
    say(pick(quotesOf("poke")));
    oneShot("squash", 500);
    oneShot("nod", 560);
    oneShot("flap", 1200);
    setTimeout(() => { if (state === "poke") state = "idle"; }, 560);
  } else {
    state = "fall"; landed = false;
  }
  wake();
});
addEventListener("resize", () => { y = Math.min(y, floorY()); });

renderSkin();
applySkin(skin, true);
buildSkinPanel();
render();
requestAnimationFrame(step);
blink();
scheduleIdleQuote();
wake();
</script>
